<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRent Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e0e6ed;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a3f5f;
        }

        h1 {
            color: #00d4ff;
            font-size: 28px;
        }

        .header-info {
            text-align: right;
            font-size: 12px;
            color: #a0aec0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a2332;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
        }

        .stat-label {
            color: #a0aec0;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
        }

        .section {
            background: #1a2332;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: #7c3aed;
            margin-bottom: 20px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a3f5f;
        }

        th {
            background: #0f1419;
            color: #a0aec0;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .status-maintenance {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-disabled {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
            margin-left: 6px;
        }

        button.danger {
            background: #ef4444;
            color: #fff;
        }
        button.danger:hover { background: #dc2626; }

        .token-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #1a2332;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            font-size: 13px;
        }
        .token-bar input {
            flex: 1;
            background: #0f1419;
            border: 1px solid #2a3f5f;
            color: #e0e6ed;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .token-bar input:focus { outline: none; border-color: #00d4ff; }
        .token-bar button { padding: 8px 14px; font-size: 12px; }
        .token-bar #token-status { color: #a0aec0; font-size: 12px; min-width: 130px; }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #00d4ff;
            color: #0f1419;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.8;
        }

        button.secondary {
            background: #7c3aed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a2332;
            border: 1px solid #2a3f5f;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #a0aec0;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: #0f1419;
            border: 1px solid #2a3f5f;
            color: #e0e6ed;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ BitRent Admin Dashboard</h1>
            <div class="header-info">
                <div id="last-update">Last update: --:--:--</div>
            </div>
        </div>

        <!-- Auth token bar -->
        <div class="token-bar">
            <span id="token-status">● non authentifié</span>
            <input type="password" id="token-input" placeholder="Collez votre JWT admin (récupéré via /admin.html après connexion)">
            <button onclick="saveTokenFromInput()">Charger</button>
            <button class="secondary" onclick="document.getElementById('token-input').type = document.getElementById('token-input').type === 'password' ? 'text' : 'password'">👁</button>
        </div>

        <div id="message"></div>

        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Miners</div>
                <div class="stat-value" id="stat-miners">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Online</div>
                <div class="stat-value" id="stat-online">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="stat-revenue">-- ₿</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Rentals</div>
                <div class="stat-value" id="stat-rentals">--</div>
            </div>
        </div>

        <!-- Miners Section -->
        <div class="section">
            <h2>⛏️ Miners</h2>
            <div class="button-group">
                <button onclick="loadMiners()">🔄 Refresh</button>
                <button class="secondary" onclick="showAddMinerModal()">➕ Add Miner</button>
            </div>
            <div id="miners-list" class="loading">Loading...</div>
        </div>

        <!-- Rentals Section -->
        <div class="section">
            <h2>📊 Recent Rentals</h2>
            <div class="button-group">
                <button onclick="loadRentals()">🔄 Refresh</button>
            </div>
            <div id="rentals-list" class="loading">Loading...</div>
        </div>

        <!-- Users Section -->
        <div class="section">
            <h2>👥 Users</h2>
            <div id="users-list" class="loading">Loading...</div>
        </div>
    </div>

    <!-- Add Miner Modal -->
    <div class="modal" id="add-miner-modal">
        <div class="modal-content">
            <h3>➕ Add New Miner</h3>
            <form onsubmit="submitAddMiner(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="miner-name" placeholder="Bitaxe #11" required>
                </div>
                <div class="form-group">
                    <label>IP Address</label>
                    <input type="text" id="miner-ip" placeholder="192.168.1.1" required>
                </div>
                <div class="form-group">
                    <label>Hashrate (TH/s)</label>
                    <input type="number" id="miner-hashrate" placeholder="100" required>
                </div>
                <div class="form-group">
                    <label>Price per Minute (sats)</label>
                    <input type="number" id="miner-price" placeholder="500" required>
                </div>
                <div class="form-group">
                    <label>Modèle</label>
                    <input type="text" id="miner-model" placeholder="ex: Bitaxe 601 / S19" value="Bitaxe">
                </div>
                <div class="form-group">
                    <label>API du miner</label>
                    <select id="miner-api">
                        <option value="bitaxe">Bitaxe (AxeOS / PATCH /api/system)</option>
                        <option value="braiins">Braiins OS (GraphQL /graphql)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button type="submit">✅ Ajouter</button>
                    <button type="button" class="secondary" onclick="closeAddMinerModal()">❌ Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Same-origin: this page is served by Vercel at bitrent.vercel.app, API is at /api/*
        const API_URL = '/api';

        function getToken() { return localStorage.getItem('bitrent_token') || ''; }
        function setToken(t) {
            if (t) localStorage.setItem('bitrent_token', t);
            else localStorage.removeItem('bitrent_token');
            renderTokenStatus();
        }
        function renderTokenStatus() {
            const t = getToken();
            const el = document.getElementById('token-status');
            if (!el) return;
            if (t) {
                el.innerHTML = '<span style="color:#10b981">● token chargé</span> <button onclick="clearToken()" style="background:transparent;color:#a0aec0;font-size:11px;padding:2px 6px;">effacer</button>';
            } else {
                el.innerHTML = '<span style="color:#ef4444">● non authentifié</span>';
            }
        }
        function clearToken() { setToken(null); showMessage('Token effacé', 'success'); }

        async function apiCall(endpoint, options = {}) {
            try {
                const token = getToken();
                const headers = {
                    'Content-Type': 'application/json',
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...options.headers,
                };
                const url = `${API_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}_t=${Date.now()}`;
                const response = await fetch(url, { ...options, headers });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    showMessage(`HTTP ${response.status}: ${data.error || 'request failed'}`, 'error');
                    return { __error: data.error || response.statusText, __status: response.status };
                }
                return data;
            } catch (error) {
                console.error('API Error:', error);
                showMessage(`Network error: ${error.message}`, 'error');
                return { __error: error.message };
            }
        }

        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            setTimeout(() => messageDiv.style.display = 'none', 5000);
        }

        async function loadStats() {
            // Pull from /api/admin/miners (authed) for full visibility incl. disabled
            const adminResult = await apiCall('/admin/miners');
            if (adminResult && adminResult.miners) {
                document.getElementById('stat-miners').textContent = adminResult.miners.length;
                const online = adminResult.miners.filter(m => m.status === 'online' && !m.metadata?.disabled).length;
                document.getElementById('stat-online').textContent = online;
                const activeRentals = adminResult.miners.filter(m => m.currently_rented).length;
                document.getElementById('stat-rentals').textContent = activeRentals;
            }
            updateLastUpdate();
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function loadMiners() {
            const result = await apiCall('/admin/miners');
            if (!result || !result.miners) {
                document.getElementById('miners-list').innerHTML = '<p style="padding:20px;color:#a0aec0;">Accès admin requis — collez votre token JWT en haut de page.</p>';
                return;
            }

            let html = '<table><thead><tr><th>Nom</th><th>IP</th><th>Hashrate</th><th>Prix/min</th><th>Statut</th><th>Fin location</th><th>Actions</th></tr></thead><tbody>';

            result.miners.forEach(miner => {
                const disabled = miner.metadata?.disabled === true;
                let statusBadge = `<span class="status-badge status-${miner.status}">${escapeHtml(miner.status)}</span>`;
                if (disabled) statusBadge += ' <span class="status-badge status-disabled">désactivé</span>';

                let endCell = '<span style="color:#4a5568;">—</span>';
                if (miner.currently_rented && miner.rental_end_time) {
                    const d = new Date(miner.rental_end_time);
                    const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
                    const day = days[d.getDay()];
                    const dateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
                    const timeStr = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    endCell = `<span style="color:#f59e0b;font-weight:bold;">🔒 ${timeStr} · ${day} ${dateStr}</span>`;
                }

                const toggleLabel = disabled ? '✅ Réactiver' : '⏸ Désactiver';
                const toggleClass = disabled ? '' : 'secondary';

                html += `
                    <tr>
                        <td>${escapeHtml(miner.name)}</td>
                        <td><code style="color:#a0aec0;font-size:12px">${escapeHtml(miner.ip_address || 'N/A')}</code></td>
                        <td>${parseFloat(miner.hashrate_specs || 0).toFixed(1)} TH/s</td>
                        <td>${miner.sats_per_minute || '-'} sats/min</td>
                        <td>${statusBadge}</td>
                        <td>${endCell}</td>
                        <td style="white-space:nowrap;">
                            <button class="${toggleClass}" style="padding:6px 10px;font-size:12px;" onclick="toggleDisabled('${miner.id}', ${disabled})">${toggleLabel}</button>
                            <button class="danger" style="padding:6px 10px;font-size:12px;background:#ef4444;color:#fff;" onclick="deleteMiner('${miner.id}', '${escapeHtml(miner.name)}', ${miner.currently_rented ? 'true' : 'false'})">🗑</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('miners-list').innerHTML = html;
        }

        async function toggleDisabled(minerId, currentlyDisabled) {
            const newState = !currentlyDisabled;
            const action = newState ? 'désactiver' : 'réactiver';
            if (!confirm(`Confirmer : ${action} ce mineur ?`)) return;

            // Fetch current metadata to merge
            const all = await apiCall('/admin/miners');
            const miner = all?.miners?.find(m => m.id === minerId);
            const newMeta = { ...(miner?.metadata || {}), disabled: newState };

            const result = await apiCall(`/admin/miners?id=${encodeURIComponent(minerId)}`, {
                method: 'PATCH',
                body: JSON.stringify({ metadata: newMeta }),
            });
            if (result && !result.__error) {
                showMessage(`✅ Mineur ${action === 'désactiver' ? 'désactivé' : 'réactivé'}`, 'success');
                await loadMiners();
                await loadStats();
            }
        }

        async function deleteMiner(minerId, name, currentlyRented) {
            if (currentlyRented) {
                showMessage(`Impossible : ${name} a une location active. Désactive-le à la place.`, 'error');
                return;
            }
            if (!confirm(`Supprimer DÉFINITIVEMENT le mineur "${name}" ?\n\nCette action est irréversible.`)) return;
            const result = await apiCall(`/admin/miners?id=${encodeURIComponent(minerId)}`, { method: 'DELETE' });
            if (result && !result.__error) {
                showMessage(`✅ Mineur ${name} supprimé`, 'success');
                await loadMiners();
                await loadStats();
            }
        }

        async function loadRentals() {
            const result = await apiCall('/rentals');
            if (!result || !result.data) return;

            if (result.data.length === 0) {
                document.getElementById('rentals-list').innerHTML = '<p style="padding: 20px; text-align: center; color: #a0aec0;">No rentals yet</p>';
                return;
            }

            let html = '<table><thead><tr><th>Miner</th><th>Client</th><th>Duration</th><th>Cost</th><th>Status</th></tr></thead><tbody>';
            
            result.data.forEach(rental => {
                html += `
                    <tr>
                        <td>${rental.miner_id}</td>
                        <td>${rental.user_id}</td>
                        <td>${rental.duration_minutes} min</td>
                        <td>${rental.total_sats} sats</td>
                        <td><span class="status-badge status-${rental.status}">${rental.status}</span></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('rentals-list').innerHTML = html;
        }

        function showAddMinerModal() {
            document.getElementById('add-miner-modal').classList.add('active');
        }

        function closeAddMinerModal() {
            document.getElementById('add-miner-modal').classList.remove('active');
        }

        async function submitAddMiner(event) {
            event.preventDefault();

            const minerData = {
                name: document.getElementById('miner-name').value.trim(),
                ip_address: document.getElementById('miner-ip').value.trim(),
                hashrate_specs: parseFloat(document.getElementById('miner-hashrate').value),
                sats_per_minute: parseInt(document.getElementById('miner-price').value, 10),
                metadata: {
                    model: document.getElementById('miner-model')?.value || 'Bitaxe',
                    api: document.getElementById('miner-api')?.value || 'bitaxe',
                },
            };

            const result = await apiCall('/admin/miners', {
                method: 'POST',
                body: JSON.stringify(minerData),
            });
            if (!result || result.__error) return;  // apiCall already showed error
            showMessage(`✅ Mineur "${result.miner.name}" ajouté`, 'success');
            closeAddMinerModal();
            event.target.reset();
            await loadMiners();
            await loadStats();
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('last-update').textContent = 
                `Last update: ${now.toLocaleTimeString()}`;
        }

        function saveTokenFromInput() {
            const v = document.getElementById('token-input').value.trim();
            if (!v) { showMessage('Token vide', 'error'); return; }
            setToken(v);
            document.getElementById('token-input').value = '';
            showMessage('Token chargé — rechargement des données', 'success');
            loadStats();
            loadMiners();
            loadRentals();
        }

        // Absorb `#token=...` from URL hash on first load (e.g. coming from Umbrel tile)
        // Hash fragments are never sent to the server, so the token doesn't leak in logs.
        (function absorbHashToken() {
            const h = window.location.hash || '';
            const m = h.match(/[#&]token=([^&]+)/);
            if (m && m[1]) {
                try {
                    const tok = decodeURIComponent(m[1]);
                    if (tok && tok.split('.').length === 3) {  // basic JWT shape check
                        localStorage.setItem('bitrent_token', tok);
                        // Scrub the URL so the token doesn't sit in the address bar / history
                        history.replaceState(null, '', window.location.pathname + window.location.search);
                    }
                } catch {}
            }
        })();

        // Initial load
        window.addEventListener('load', async () => {
            renderTokenStatus();
            await loadStats();
            await loadMiners();
            await loadRentals();
        });

        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
